name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee /tmp/cargo-test.log

      - name: Annotate cargo test failures
        if: failure()
        run: python3 ci/annotate.py /tmp/cargo-test.log

      - name: cargo build --release
        id: release
        if: success()
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee /tmp/cargo-release.log

      - name: Annotate cargo build failures
        if: failure()
        run: python3 ci/annotate.py /tmp/cargo-release.log

      - name: Smoke test the release binary
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ./target/release/mlxysftele help > /tmp/smoke-help.log
          ./target/release/mlxysftele stats > /tmp/smoke-stats.log
          ./target/release/mlxysftele premium info > /tmp/smoke-premium.log
          cat /tmp/smoke-stats.log

      - name: Export Cargo.lock as annotation chunks
        if: success()
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then echo "no Cargo.lock"; exit 0; fi
          DATA=$(gzip -9 -c Cargo.lock | base64 -w0)
          CHUNK=3500
          TOTAL=$(( (${#DATA} + CHUNK - 1) / CHUNK ))
          echo "exporting gzipped Cargo.lock (${#DATA} b64 chars) in $TOTAL chunk(s)"
          i=0
          while [ "$i" -lt "$TOTAL" ]; do
            START=$((i * CHUNK))
            echo "::notice::CARGO_LOCK_CHUNK $i/$TOTAL ${DATA:$START:$CHUNK}"
            i=$((i + 1))
          done
