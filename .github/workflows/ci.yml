name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries for the GUI build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee /tmp/cargo-test.log

      - name: Annotate cargo test failures
        if: failure()
        run: python3 ci/annotate.py /tmp/cargo-test.log

      - name: cargo build --release
        id: release
        if: success()
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee /tmp/cargo-release.log

      - name: Annotate cargo build failures
        if: failure()
        run: python3 ci/annotate.py /tmp/cargo-release.log

      - name: Export Cargo.lock (temporary, for local commit)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
import gzip, base64
data = open('Cargo.lock','rb').read()
enc = base64.b64encode(gzip.compress(data, 9)).decode()
chunk = 3500
n = (len(enc) + chunk - 1) // chunk
print(f'::notice::CARGO_LOCK_TOTAL bytes={len(data)} b64={len(enc)} chunks={n}')
for i in range(n):
    print(f'::notice::CARGO_LOCK_CHUNK {i} ' + enc[i*chunk:(i+1)*chunk])
"

      - name: Smoke test the release binary
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ./target/release/mlxysftele help > /tmp/smoke-help.log
          ./target/release/mlxysftele stats > /tmp/smoke-stats.log
          ./target/release/mlxysftele premium info > /tmp/smoke-premium.log
          cat /tmp/smoke-stats.log
